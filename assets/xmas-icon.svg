<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="35%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="55%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#5c0a14" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
  </defs>

  <!-- Outer Vibrant Squircle Badge -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="18" />

  <!-- Inner Festive Glow Ring -->
  <rect x="44" y="44" width="424" height="424" rx="88" fill="none" stroke="#fde68a" stroke-opacity="0.35" stroke-width="4" />

  <!-- Falling Snowflakes -->
  <g fill="#ffffff" opacity="0.92">
    <circle cx="96" cy="112" r="9" />
    <circle cx="145" cy="82" r="5.5" />
    <circle cx="386" cy="96" r="8" />
    <circle cx="424" cy="148" r="6" />
    <circle cx="88" cy="240" r="6" />
    <circle cx="426" cy="268" r="9" />
    <circle cx="116" cy="396" r="7" />
    <circle cx="404" cy="404" r="7" />
  </g>

  <!-- Soft Drop Shadow for Card -->
  <g transform="rotate(-7 256 260)">
    <rect x="120" y="114" width="280" height="236" rx="26" fill="#3a060c" opacity="0.45" />
    <!-- Tilted White-Gold Christmas Card -->
    <rect x="116" y="102" width="280" height="236" rx="26" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="7" />

    <!-- Bright Star on Top of Tree -->
    <polygon points="256,118 263,136 282,137 267,149 272,167 256,157 240,167 245,149 230,137 249,136" fill="#f59e0b" stroke="#b45309" stroke-width="2" />

    <!-- Vivid Green Christmas Tree -->
    <polygon points="256,154 202,216 310,216" fill="url(#treeGrad)" />
    <polygon points="256,184 186,256 326,256" fill="url(#treeGrad)" />
    <polygon points="256,216 168,296 344,296" fill="url(#treeGrad)" />
    <rect x="240" y="294" width="32" height="26" rx="4" fill="#78350f" />

    <!-- Bright Tree Ornaments -->
    <circle cx="242" cy="202" r="7.5" fill="#ef4444" />
    <circle cx="272" cy="206" r="6.5" fill="#fde047" />
    <circle cx="222" cy="242" r="8" fill="#38bdf8" />
    <circle cx="260" cy="236" r="8.5" fill="#fbbf24" />
    <circle cx="288" cy="246" r="7.5" fill="#ef4444" />
    <circle cx="204" cy="280" r="8.5" fill="#fde047" />
    <circle cx="244" cy="274" r="8.5" fill="#ef4444" />
    <circle cx="284" cy="282" r="8" fill="#38bdf8" />
    <circle cx="310" cy="284" r="6.5" fill="#f472b6" />
  </g>

  <!-- Envelope Shadow -->
  <path d="M96 302 L256 390 L424 302 L424 414 C424 434 408 450 388 450 L132 450 C112 450 96 434 96 414 Z" fill="#3a060c" opacity="0.45" />

  <!-- Crisp Red-Gold Envelope Pocket at Bottom -->
  <path d="M92 292 L256 382 L420 292 L420 406 C420 426 404 442 384 442 L128 442 C108 442 92 426 92 406 Z" fill="#991b1b" stroke="#fbbf24" stroke-width="7" stroke-linejoin="round" />
  <path d="M98 426 L212 352 M414 426 L300 352" stroke="#fca5a5" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round" />

  <!-- Wax Seal Star Badge on Envelope -->
  <circle cx="256" cy="388" r="36" fill="#3a060c" opacity="0.4" />
  <circle cx="256" cy="382" r="34" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="5" />
  <polygon points="256,360 262,374 277,375 265,384 269,399 256,390 243,399 247,384 235,375 250,374" fill="#7f1d1d" />

  <!-- Top Ribbon Banner: X-MAS -->
  <g transform="translate(256 68)">
    <rect x="-86" y="-22" width="172" height="44" rx="22" fill="#15803d" stroke="#fde047" stroke-width="5" />
    <text x="0" y="9" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="25" letter-spacing="2" fill="#ffffff">X-MAS</text>
  </g>
</svg>
